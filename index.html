<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" href="onboarding/chat/astral-logo-planet.png?v=1">
        <title>Welcome - Astral</title>
        <style>
            :root {
                --astral-aurora-green: #00f0dd;
                --astral-boreal-blue: #53b4dd;
                --astral-space-purple: #a878ff;
            }

            *, *::before, *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: "Google Sans", sans-serif;
                color: #ffffff;
            }

            html, body {
                background-color: #222222;
                display: flex;
                flex-direction: column;
                align-items: center;
                min-height: 100vh;
                width: 100%;
                padding: 0 12px;
                overflow-x: hidden; 
                padding-top: 45px;
            }

            header {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                margin-left: calc(-50vw + 50%);
                margin-right: calc(-50vw + 50%);
                background: transparent !important;
                z-index: 1000;
                display: flex;
                align-items: center;
                justify-content: flex-start;
                gap: 12px;
                padding: 4px 24px;
                border-bottom: 1px solid #555555;
            }

            .logo {
                width: clamp(72px, 15vw, 96px);
                height: clamp(72px, 15vw, 96px);
                object-fit: contain;
                flex-shrink: 0;
            }

            .color-text {
                font-size: 50px;
                font-weight: 700;
                background: linear-gradient(
                    to right,
                    var(--astral-aurora-green) 0%,
                    var(--astral-aurora-green) 33.33%,
                    var(--astral-boreal-blue) 33.33%,
                    var(--astral-boreal-blue) 66.66%,
                    var(--astral-space-purple) 66.66%,
                    var(--astral-space-purple) 100%
                );
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
            }
        </style>
    </head>
    <body>
        <header>
            <img class="logo" src="onboarding/chat/astral-logo-planet.png" alt="Astral logo">
        </header>

        <p class="color-text">Welcome to Astral, your new AI assistant.</p>
    </body>
</html>
